<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Nod Elite V10.3.1 | Logic Refinement</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- CYBERPUNK HUD THEME (UNCHANGED) --- */
        :root { 
            --neon-blue: #00f3ff; 
            --neon-red: #ff2a2a; 
            --neon-amber: #ffae00; 
            --glass-bg: rgba(20, 20, 25, 0.90);
            --panel-border: 1px solid rgba(255, 255, 255, 0.1);
            --bg-color: #050507;
        }

        body { 
            background: var(--bg-color); 
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #050507 80%);
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        header { margin-top: 30px; text-align: center; z-index: 2; }
        h1 {
            font-weight: 800; letter-spacing: 4px; font-size: 2.2rem; margin: 0;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #666; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        #ui-wrapper { 
            display: flex; gap: 30px; padding: 30px; 
            max-width: 1400px; width: 90%;
            flex-wrap: wrap; justify-content: center; align-items: flex-start;
        }

        .vid-frame { 
            position: relative; 
            border: 2px solid #333; border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.05);
            width: 640px; height: 480px;
            background: #000;
        }
        video { transform: scaleX(-1); width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.85; }

        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);
            animation: scan 3s infinite linear; opacity: 0.5; pointer-events: none; z-index: 5;
            display: none;
        }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        #alarm-overlay { 
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(20, 0, 0, 0.9); backdrop-filter: blur(8px);
            border: 4px solid var(--neon-red); z-index: 20; 
            justify-content: center; align-items: center; text-align: center; flex-direction: column; 
            animation: pulse-red 1s infinite;
        }
        @keyframes pulse-red { 0% { box-shadow: inset 0 0 20px var(--neon-red); } 50% { box-shadow: inset 0 0 80px var(--neon-red); } }

        .alarm-title { font-size: 3.5rem; font-weight: 900; color: var(--neon-red); margin: 0; letter-spacing: 3px; }
        .alarm-desc { font-size: 1.2rem; font-weight: 600; color: white; background: var(--neon-red); padding: 5px 20px; border-radius: 4px; margin-top: 10px; }

        #ack-btn { 
            margin-top: 30px; background: transparent; border: 2px solid white; color: white; 
            padding: 12px 35px; font-family: 'JetBrains Mono', monospace; font-weight: 700; 
            cursor: pointer; transition: 0.2s; text-transform: uppercase; 
        }
        #ack-btn:hover { background: white; color: black; }

        .panel { 
            width: 360px; background: var(--glass-bg); padding: 25px; 
            border-radius: 20px; border: var(--panel-border);
            backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .status-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; margin-right: 8px;}
        .dot.active { background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .dot.warn { background: var(--neon-amber); animation: blink 0.5s infinite; }
        .dot.paused { background: #666; }
        .status-indicator { display: flex; align-items: center; color: white; font-weight: 600; font-size: 0.9rem;}

        .metric-grid { display: grid; gap: 12px; }
        .metric-card { 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; 
            position: relative; border-left: 3px solid #333; transition: 0.3s;
        }
        .metric-card.good { border-left-color: var(--neon-blue); }
        .metric-card.bad { border-left-color: var(--neon-red); background: rgba(255, 42, 42, 0.1); }

        .metric-label { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .metric-value { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; color: #fff; margin-top: 4px; }

        .badge { 
            position: absolute; top: 12px; right: 12px; font-size: 0.6rem; padding: 4px 8px; 
            border-radius: 4px; background: #222; color: #666; font-weight: 700;
        }
        .badge.active { background: var(--neon-blue); color: #000; }
        .badge.alert { background: var(--neon-red); color: white; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { flex:1; padding: 15px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; min-width: 140px; }
        .btn-primary { background: var(--neon-blue); color: #000; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary.suppressed { background: var(--neon-amber); color: #000; }
        .btn-toggle { background: #222; color: #888; border: 1px solid #444; width: 100%; margin-bottom: 5px; }
        .btn-toggle.active { background: var(--neon-amber); color: #000; border-color: var(--neon-amber); }

        #warning-bar {
            background: rgba(255, 42, 42, 0.2); border: 1px solid var(--neon-red); color: #ffcccc;
            font-size: 0.65rem; padding: 8px; margin-top: 15px; text-align: center;
            border-radius: 6px; display: none; font-weight: 600;
        }

        #loader { position: absolute; top:0; left:0; width:100%; height:100%; background:#000; display:flex; justify-content:center; align-items:center; z-index:50; flex-direction: column;}
        .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top: 3px solid var(--neon-blue); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>Neuro-Nod <span style="font-weight:300">Elite</span></h1>
        <div class="subtitle">Multi-Axis Driver Monitoring System (V10.3.1)</div>
    </header>

    <div id="ui-wrapper">
        <div class="vid-frame">
            <div id="loader"><div class="spinner"></div><p style="color:#666; font-size:0.8rem; margin-top:10px;">OPTIMIZING ENGINE...</p></div>
            <div class="scan-line" id="scan-line"></div>
            <video id="input_video" playsinline></video>

            <div id="alarm-overlay">
                <h1 class="alarm-title">DANGER</h1>
                <div class="alarm-desc" id="alert-reason">FATIGUE DETECTED</div>
                <button id="ack-btn">Acknowledge</button>
            </div>
        </div>

        <div class="panel">
            <div class="status-header">
                <span style="color:#888; font-size:0.8rem;">SYSTEM STATUS</span>
                <div class="status-indicator">
                    <div id="status-dot" class="dot"></div>
                    <span id="status-text">STANDBY</span>
                </div>
            </div>

            <div class="metric-grid">
                <div class="metric-card" id="card-head">
                    <div class="metric-label">Head Pose (Pitch / Roll)</div>
                    <div class="metric-value" id="head-val">0.0° / 0.0°</div>
                    <div id="slump-badge" class="badge">STABLE</div>
                </div>

                <div class="metric-card" id="card-eye">
                    <div class="metric-label">Eye Openness (EAR)</div>
                    <div class="metric-value" id="ear-val">0.00</div>
                    <div id="sunglass-badge" class="badge">VISION CLEAR</div>
                </div>

                <div class="metric-card" id="card-mouth">
                    <div class="metric-label">Mouth (MAR)</div>
                    <div class="metric-value" id="mar-val">0.00</div>
                </div>
            </div>

            <div id="warning-bar">SUNGLASSES MODE: REDUCED ACCURACY (HEAD POSTURE ONLY)</div>
            <div id="msg-box" style="margin-top:15px; text-align:center; font-size:0.75rem; color:#666; font-weight:bold;">SYSTEM READY</div>

            <div class="btn-group">
                <button id="modeToggle" class="btn btn-toggle">Mode: Standard</button>
                <button id="startBtn" class="btn btn-primary">Start System</button>
                <button id="pauseBtn" class="btn btn-secondary">Pause (20s)</button>
            </div>
        </div>
    </div>

<script>
    // --- APP STATE & DOM ---
    const videoElement = document.getElementById('input_video');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const modeToggle = document.getElementById('modeToggle');
    const ackBtn = document.getElementById('ack-btn');
    const loader = document.getElementById('loader');
    const statusText = document.getElementById('status-text'), statusDot = document.getElementById('status-dot'), msgBox = document.getElementById('msg-box');
    const headVal = document.getElementById('head-val'), earVal = document.getElementById('ear-val'), marVal = document.getElementById('mar-val');
    const slumpBadge = document.getElementById('slump-badge'), sunglassBadge = document.getElementById('sunglass-badge');
    const alarmOverlay = document.getElementById('alarm-overlay'), alertReason = document.getElementById('alert-reason');
    const cardHead = document.getElementById('card-head'), cardEye = document.getElementById('card-eye'), cardMouth = document.getElementById('card-mouth');
    const warningBar = document.getElementById('warning-bar');

    let audioCtx, mainGain, osc;
    let isCalibrated = false, calibrationStartTime = 0;
    let basePitch = 0, baseRoll = 0, baseEAR = 0, baseMAR = 0;
    let sPitch=0, sRoll=0, sEAR=0, sMAR=0;
    
    // PHYSICS
    const ALPHA = 0.15; 
    const RAD_TO_DEG = 180 / Math.PI;
    
    // WATCHDOG TIMERS
    let timers = { 
        deepDrop: null, 
        sideSlump: null, 
        stiffEye: null,
        yawn: null
    };
    
    // GLOBALS V10.3.1
    let faceLostTimer = null;
    let sunglassTimer = null;
    let persistentSunglasses = false; // Internal auto-detection state
    let manualSunglassesMode = false; // V10.3 Manual Override

    let muteUntil = 0, suppressUntil = 0;

    function initAudio() {
        if(audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain(); 
        mainGain.gain.value = 0; 
        mainGain.connect(audioCtx.destination);
        osc = audioCtx.createOscillator(); 
        osc.type = 'sawtooth'; 
        osc.frequency.value = 850;
        osc.connect(mainGain); 
        osc.start();
    }

    function setAlarm(active) {
        if(!audioCtx) return;
        const now = audioCtx.currentTime;
        mainGain.gain.cancelScheduledValues(now);
        mainGain.gain.linearRampToValueAtTime(active ? 0.25 : 0, now + 0.1);
    }

    // Audio Control V10.2+
    function handleAudio(active, type, now) {
        if(!audioCtx) return;
        
        if (active) {
            const targetFreq = (type === 'pulse') ? 440 : 850;
            if (osc.frequency.value !== targetFreq) {
                osc.frequency.setValueAtTime(targetFreq, audioCtx.currentTime);
            }

            if (type === 'pulse') {
                const cycle = now % 800; 
                if (cycle < 200) { setAlarm(true); } else { setAlarm(false); }
            } else {
                setAlarm(true);
            }
        } else {
            setAlarm(false);
        }
    }

    function dist3D(p1, p2) { 
        return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) + Math.pow(p1.z - p2.z, 2)); 
    }

    function onResults(results) {
        const now = performance.now();
        if (loader.style.display !== "none") loader.style.display = "none";

        if (now < suppressUntil) {
            handleSuspensionUI(now);
            return;
        } else resetSuspensionUI();

        // 3. FACE LOST FAILSAFE (V10.2)
        if (!results.multiFaceLandmarks || !results.multiFaceLandmarks[0]) {
            if (isCalibrated) {
                if (!faceLostTimer) faceLostTimer = now;
                if (now - faceLostTimer > 1500) {
                    alarmOverlay.style.display = "flex";
                    alertReason.innerText = "FACE LOST - CHECK POSITION";
                    handleAudio(true, 'pulse', now);
                    return; 
                }
            }
            return;
        } else {
            faceLostTimer = null;
            if (alertReason.innerText === "FACE LOST - CHECK POSITION") {
                 alarmOverlay.style.display = "none";
                 setAlarm(false);
            }
        }

        const lm = results.multiFaceLandmarks[0];

        // 1. CALCULATE RAW PHYSICS (3D)
        const rawPitch = Math.atan2(lm[1].y - lm[152].y, lm[1].z - lm[152].z) * RAD_TO_DEG;
        const rawRoll = Math.atan2(lm[362].y - lm[133].y, lm[362].x - lm[133].x) * RAD_TO_DEG;
        
        const leftE = dist3D(lm[159], lm[145]) / dist3D(lm[33], lm[133]);
        const rightE = dist3D(lm[386], lm[374]) / dist3D(lm[362], lm[263]);
        const rawEAR = (leftE + rightE) / 2;
        const rawMAR = dist3D(lm[13], lm[14]) / dist3D(lm[1], lm[152]);

        // 2. SMOOTHING (EMA)
        sPitch = (ALPHA * rawPitch) + (1 - ALPHA) * sPitch;
        sRoll  = (ALPHA * rawRoll)  + (1 - ALPHA) * sRoll;
        sEAR   = (ALPHA * rawEAR)   + (1 - ALPHA) * sEAR;
        sMAR   = (ALPHA * rawMAR)   + (1 - ALPHA) * sMAR;

        headVal.innerText = `${sPitch.toFixed(1)}° / ${sRoll.toFixed(1)}°`;
        earVal.innerText = sEAR.toFixed(2);
        marVal.innerText = sMAR.toFixed(2);

        // 3. CALIBRATION
        if (!isCalibrated) {
            handleCalibration(now);
            return;
        }

        // 4. MAIN LOGIC CORE (V10.3.1)
        processLogicV10(now);
    }

    function handleCalibration(now) {
        if (calibrationStartTime === 0) calibrationStartTime = now;
        const elapsed = now - calibrationStartTime;
        statusText.innerText = `CALIBRATING (${Math.ceil((3000-elapsed)/1000)}s)`;
        statusDot.className = "dot warn";
        msgBox.innerText = "LOOK STRAIGHT AT ROAD...";
        
        basePitch = (basePitch * 0.9) + (sPitch * 0.1);
        baseRoll = (baseRoll * 0.9) + (sRoll * 0.1);
        baseEAR = (baseEAR * 0.9) + (sEAR * 0.1);
        baseMAR = (baseMAR * 0.9) + (sMAR * 0.1);

        if (elapsed > 3000) {
            isCalibrated = true;
            statusText.innerText = "ACTIVE";
            statusDot.className = "dot active";
            document.getElementById('scan-line').style.display = "block";
        }
    }

    // --- REFINED LOGIC ENGINE V10.3.1 ---
    function processLogicV10(now) {
        let activeAlarm = null;

        // --- DEFINITIONS & ZONES ---
        const isNodding = sPitch < (basePitch - 28); 
        const isDeepDrop = sPitch < (basePitch - 43); 
        const isSlumping = Math.abs(sRoll - baseRoll) > 15;
        
        // 1. SMART SUNGLASSES LOGIC
        if (manualSunglassesMode) {
            persistentSunglasses = true;
        } else {
            // Standard Auto-Detection Logic
            if (sEAR < 0.05) {
                if (!sunglassTimer) sunglassTimer = now;
                if (now - sunglassTimer > 2000) persistentSunglasses = true;
            } else if (sEAR > 0.08) {
                sunglassTimer = null;
                persistentSunglasses = false;
            }
        }
        
        const isSunglasses = persistentSunglasses; 
        const isEyesClosed = isSunglasses ? false : (sEAR < (baseEAR * 0.60));

        // --- WATCHDOG 1: DEEP DROP (Critical Failsafe) ---
        if (isDeepDrop) {
            if (!timers.deepDrop) timers.deepDrop = now;
            if (now - timers.deepDrop > 800) activeAlarm = "CRITICAL: HEAD DROP"; 
            cardHead.classList.add("bad");
            slumpBadge.innerText = "HEAD DROP"; slumpBadge.className = "badge alert";
        } else {
            timers.deepDrop = null;
        }

        // --- WATCHDOG 2: NODDING & SIDE SLUMP ---
        if ((isNodding && !isDeepDrop) || isSlumping) {
            cardHead.classList.add("bad"); 
            
            if (isSlumping) {
                slumpBadge.innerText = "SIDE SLUMP"; 
            } else {
                slumpBadge.innerText = "NODDING"; 
            }
            slumpBadge.className = "badge alert";

            // --- V10.3.1 LOGIC REFINEMENT ---
            let shouldTriggerAudio = false;

            if (manualSunglassesMode) {
                // Sunglasses Mode: Eyes are invisible. Posture is the ONLY signal.
                // Any detected Nod or Slump is treated as fatigue.
                shouldTriggerAudio = true;
            } else {
                // Standard Mode: "Safety Guard" Active.
                // Audio triggers only if Posture is bad AND (Eyes are Closed OR Auto-detected Sunglasses)
                if (isEyesClosed || persistentSunglasses) {
                    shouldTriggerAudio = true;
                }
            }

            if (shouldTriggerAudio) {
                 if (!timers.sideSlump) timers.sideSlump = now;
                 // V10.3.1 Threshold: 1.2s strict for sunglasses mode, or dynamic based on slump
                 const threshold = (manualSunglassesMode || !isSlumping) ? 1200 : 1500; 

                 if (now - timers.sideSlump > threshold) {
                    activeAlarm = isSlumping ? "CRITICAL: SIDE SLUMP" : "DROWSINESS DETECTED";
                 }
                 
                 // Dynamic UI Message
                 if (manualSunglassesMode) {
                     msgBox.innerText = "POSTURE ALARM (MANUAL MODE)";
                 } else {
                     msgBox.innerText = "FATIGUE (POSTURE + EYES)";
                 }
                 msgBox.style.color = "var(--neon-red)";
            } else {
                // Standard Mode + Eyes Open = Silent Visual Warning
                timers.sideSlump = null; 
                msgBox.innerText = "POSTURE WARNING (VISUAL)";
                msgBox.style.color = "var(--neon-amber)";
            }
        } else if (!isDeepDrop) {
            timers.sideSlump = null;
            cardHead.classList.remove("bad");
            slumpBadge.innerText = "STABLE"; slumpBadge.className = "badge";
        }

        // --- WATCHDOG 3: STIFF NECK SLEEP ---
        if (!isDeepDrop && !isSlumping && !isNodding) {
            if (isSunglasses) {
                sunglassBadge.innerText = "SUNGLASSES"; sunglassBadge.className = "badge active";
                cardEye.classList.remove("bad");
            } else {
                sunglassBadge.innerText = "VISION CLEAR"; sunglassBadge.className = "badge";
                
                if (isEyesClosed) {
                    if (!timers.stiffEye) timers.stiffEye = now;
                    if (now - timers.stiffEye > 1500) activeAlarm = "DROWSINESS (EYES)";
                    cardEye.classList.add("bad");
                    msgBox.innerText = "WAKE UP!";
                } else {
                    timers.stiffEye = null;
                    cardEye.classList.remove("bad");
                    if (!activeAlarm && msgBox.innerText !== "MOUTH WIDE OPEN") { msgBox.innerText = "SYSTEM ACTIVE"; msgBox.style.color = "#666"; }
                }
            }
        }

        // --- YAWN LOGIC (Visual Only) ---
        const yawnThresh = baseMAR > 0 ? (baseMAR * 3.5) : 0.55; 
        
        if (sMAR > yawnThresh) {
            cardMouth.classList.add("bad");
            msgBox.innerText = "MOUTH WIDE OPEN";
            msgBox.style.color = "var(--neon-amber)";
        } else { 
            cardMouth.classList.remove("bad"); 
            if (!activeAlarm && !isNodding && !isSlumping && !isEyesClosed) {
                 msgBox.innerText = "SYSTEM ACTIVE"; msgBox.style.color = "#666"; 
            }
        }

        // --- OUTPUT ---
        if (activeAlarm && now > muteUntil) {
            alarmOverlay.style.display = "flex";
            alertReason.innerText = activeAlarm;
            handleAudio(true, 'standard', now); 
        } else {
            if (alertReason.innerText !== "FACE LOST - CHECK POSITION") {
                alarmOverlay.style.display = "none";
                handleAudio(false, 'standard', now);
            }
        }
    }

    function handleSuspensionUI(now) {
        const left = Math.ceil((suppressUntil - now) / 1000);
        pauseBtn.innerText = `RESUME IN: ${left}s`;
        pauseBtn.classList.add("suppressed");
        statusText.innerText = "SUSPENDED";
        statusDot.className = "dot paused";
        setAlarm(false);
    }

    function resetSuspensionUI() {
        if (pauseBtn.classList.contains("suppressed")) {
            pauseBtn.classList.remove("suppressed");
            pauseBtn.innerText = "PAUSE (20s)";
            statusText.innerText = "ACTIVE";
            statusDot.className = "dot active";
        }
    }
    
    // --- MANUAL MODE HANDLER ---
    modeToggle.onclick = () => {
        manualSunglassesMode = !manualSunglassesMode;
        if (manualSunglassesMode) {
            modeToggle.classList.add("active");
            modeToggle.innerText = "Mode: Sunglasses";
            warningBar.style.display = "block";
            sunglassBadge.innerText = "MANUAL MODE";
            sunglassBadge.className = "badge active";
        } else {
            modeToggle.classList.remove("active");
            modeToggle.innerText = "Mode: Standard";
            warningBar.style.display = "none";
            persistentSunglasses = false; 
        }
    };

    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, { onFrame: async () => { await faceMesh.send({image: videoElement}); }, width: 640, height: 480 });

    startBtn.onclick = () => { initAudio(); startBtn.style.display = "none"; camera.start(); };
    ackBtn.onclick = () => { muteUntil = performance.now() + 5000; alarmOverlay.style.display = "none"; setAlarm(false); };
    pauseBtn.onclick = () => { suppressUntil = performance.now() + 20000; };
</script>
</body>
</html>
